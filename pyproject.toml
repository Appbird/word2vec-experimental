[project]
name = "word2vec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "appbird", email = "project.appbird@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[project.scripts]
word2vec = "word2vec:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
